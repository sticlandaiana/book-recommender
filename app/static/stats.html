<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistici</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --pink-bg: #fff0f5; --pink-soft: #fde2ec; --pink-light: #f8c8dc;
      --pink-main: #e75480; --pink-dark: #c2185b; --text-dark: #5a2a3c;
    }
    body { background: var(--pink-bg); color: var(--text-dark); }
    h1 { color: var(--pink-dark); }
    a { color: var(--pink-main); }
    .text-muted { color: #9c6b7e !important; }
    .panel { background: #fff; border: 1px solid var(--pink-light); border-radius: 1rem; padding: 1.25rem; height: 100%; }
    .panel h6 { color: var(--pink-dark); }
    .chart-box { position: relative; height: 300px; }
  </style>
</head>
<body>
<div class="container py-4" style="max-width: 1000px;">
  <a href="/" class="text-decoration-none">← Meniu</a>
  <h1 class="mt-2 mb-1">📊 Statistici despre colecție</h1>
  <p class="text-muted" id="total">Se încarcă...</p>

  <div class="row g-3">
    <div class="col-md-6"><div class="panel"><h6>Distribuția rating-urilor medii</h6><div class="chart-box"><canvas id="c1"></canvas></div></div></div>
    <div class="col-md-6"><div class="panel"><h6>Cele mai frecvente genuri</h6><div class="chart-box"><canvas id="c2"></canvas></div></div></div>
    <div class="col-md-6"><div class="panel"><h6>Top 10 autori după numărul de cărți</h6><div class="chart-box"><canvas id="c3"></canvas></div></div></div>
    <div class="col-md-6"><div class="panel"><h6>Limbi de publicare</h6><div class="chart-box"><canvas id="c4"></canvas></div></div></div>
  </div>
</div>

<script>
const PINK = "#e75480";
const PALETTE = ["#e75480", "#f48fb1", "#c2185b", "#f8bbd0", "#ad1457", "#ff80ab", "#d81b60", "#fce4ec"];

function bar(id, data, horizontal) {
  new Chart(document.getElementById(id), {
    type: "bar",
    data: { labels: data.labels, datasets: [{ data: data.values, backgroundColor: PINK, borderRadius: 4 }] },
    options: {
      indexAxis: horizontal ? "y" : "x",
      maintainAspectRatio: false,
      plugins: { legend: { display: false } }
    }
  });
}

async function load() {
  try {
    const s = await (await fetch("/api/stats")).json();
    document.getElementById("total").textContent =
      s.total_books.toLocaleString("ro-RO") + " cărți în colecție (după curățare)";
    bar("c1", s.rating_hist, false);
    bar("c2", s.top_genres, true);
    bar("c3", s.top_authors, true);
    new Chart(document.getElementById("c4"), {
      type: "doughnut",
      data: { labels: s.languages.labels,
              datasets: [{ data: s.languages.values, backgroundColor: PALETTE }] },
      options: { maintainAspectRatio: false }
    });
  } catch (e) {
    document.getElementById("total").textContent = "Eroare la încărcarea statisticilor.";
  }
}
load();
</script>
</body>
</html>
