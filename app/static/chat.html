<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat recomandări</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --pink-bg: #fff0f5; --pink-soft: #fde2ec; --pink-light: #f8c8dc;
      --pink-main: #e75480; --pink-dark: #c2185b; --text-dark: #5a2a3c;
    }
    html, body { height: 100%; }
    body { background: var(--pink-bg); color: var(--text-dark); display: flex; flex-direction: column; }
    header { background: #fff; border-bottom: 1px solid var(--pink-light); }
    header a { color: var(--pink-main); text-decoration: none; }
    header h5 { color: var(--pink-dark); }
    #chat { flex: 1; overflow-y: auto; padding: 1.5rem 0; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 1rem; }
    .msg { display: flex; margin-bottom: 1rem; }
    .msg.user { justify-content: flex-end; }
    .bubble {
      max-width: 85%; padding: .75rem 1rem; border-radius: 1.1rem;
      white-space: pre-wrap; line-height: 1.45;
    }
    .msg.bot .bubble {
      background: #fff; border: 1px solid var(--pink-light); border-top-left-radius: .3rem;
    }
    .msg.user .bubble {
      background: var(--pink-main); color: #fff; border-top-right-radius: .3rem;
    }
    .bubble .title { color: var(--pink-dark); font-weight: 600; }
    .bubble .meta { color: #9c6b7e; font-size: .9rem; }
    .btn-pink { background: var(--pink-main); border-color: var(--pink-main); color: #fff; }
    .btn-pink:hover { background: var(--pink-dark); border-color: var(--pink-dark); color: #fff; }
    .btn-outline-pink { color: var(--pink-main); border-color: var(--pink-main); }
    .btn-outline-pink:hover { background: var(--pink-light); color: var(--pink-dark); border-color: var(--pink-main); }
    footer { background: #fff; border-top: 1px solid var(--pink-light); padding: 1rem 0; }
    .form-control:focus { border-color: var(--pink-main); box-shadow: 0 0 0 .25rem rgba(231, 84, 128, .25); }
    .typing { color: #9c6b7e; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <div class="wrap d-flex justify-content-between align-items-center py-3">
      <h5 class="mb-0">💬 Botul de recomandări</h5>
      <a href="/">← Meniu</a>
    </div>
  </header>

  <div id="chat">
    <div class="wrap" id="messages"></div>
  </div>

  <footer>
    <div class="wrap">
      <div class="input-group">
        <input type="text" id="input" class="form-control"
               placeholder="ex: a dark detective story with a murder mystery" autocomplete="off">
        <button id="send" class="btn btn-pink">Trimite</button>
      </div>
      <div class="form-text">Scrie în engleză. Scrie „altceva” ca să primești altă recomandare.</div>
    </div>
  </footer>

<script>
const messagesEl = document.getElementById("messages");
const chatEl = document.getElementById("chat");
const input = document.getElementById("input");

let results = [];
let pos = 0;

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML;
}

function addMessage(role, html) {
  const row = document.createElement("div");
  row.className = "msg " + role;
  row.innerHTML = '<div class="bubble">' + html + '</div>';
  messagesEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return row;
}

function shorten(text, max) {
  max = max || 450;
  if (!text) return "";
  text = text.replace(/\s+/g, " ").trim();
  if (text.length <= max) return text;
  const cut = text.slice(0, max);
  const end = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
  return end > 150 ? cut.slice(0, end + 1) : cut.slice(0, cut.lastIndexOf(" ")) + "…";
}

function bookMessage(b, first) {
  const intro = first ? "Ți-aș recomanda:" : "Altă variantă care ți s-ar potrivi:";
  let html = intro + "\n\n";
  html += '<span class="title">📖 ' + esc(b.title) + "</span>\n";
  html += '<span class="meta">de ' + esc(b.author)
        + (b.rating ? " · ⭐ " + b.rating : "")
        + " · " + (b.score * 100).toFixed(0) + "% potrivire</span>\n\n";
  if (b.description) html += esc(shorten(b.description)) + "\n\n";
  if (b.because && b.because.length) {
    html += '<span class="meta">Ți-o recomand pentru că se potrivește cu: '
          + b.because.map(esc).join(", ") + ".</span>\n\n";
  }
  html += '<button class="btn btn-sm btn-outline-pink" onclick="nextBook()">Altă recomandare</button>';
  return html;
}

function nextBook() {
  if (!results.length) return;
  pos++;
  if (pos >= results.length) {
    addMessage("bot", "Asta a fost tot ce am găsit pentru cererea ta. Încearcă o descriere nouă! 🙂");
    pos = results.length - 1;
    return;
  }
  addMessage("bot", bookMessage(results[pos], false));
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMessage("user", esc(text));

  if (/^(altceva|alta|altă|another|next|more)\b/i.test(text) && results.length) {
    nextBook();
    return;
  }

  const typing = addMessage("bot", '<span class="typing">Caut printre cărți...</span>');
  try {
    const res = await fetch("/api/by-text?q=" + encodeURIComponent(text) + "&n=10");
    results = await res.json();
    pos = 0;
    typing.remove();
    if (!results.length) {
      addMessage("bot", "Nu am găsit nimic potrivit. Încearcă să descrii altfel cartea, cu cuvinte-cheie în engleză (gen, atmosferă, personaje, teme).");
      return;
    }
    addMessage("bot", bookMessage(results[0], true));
  } catch (e) {
    typing.remove();
    addMessage("bot", "Ups, nu pot comunica cu serverul acum.");
  }
}

document.getElementById("send").addEventListener("click", send);
input.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });

addMessage("bot", "Salut! 👋 Spune-mi ce fel de carte cauți (în engleză), de exemplu: ‘a dark detective story with a murder mystery’ sau ‘fantasy with dragons and magic school’, iar eu îți recomand una.");
</script>
</body>
</html>
