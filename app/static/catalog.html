<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorează cărțile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --pink-bg: #fff0f5; --pink-soft: #fde2ec; --pink-light: #f8c8dc;
      --pink-main: #e75480; --pink-dark: #c2185b; --text-dark: #5a2a3c;
    }
    body { background: var(--pink-bg); color: var(--text-dark); }
    h1 { color: var(--pink-dark); }
    a { color: var(--pink-main); }
    .text-muted { color: #9c6b7e !important; }
    .filters { background: var(--pink-soft); border: 1px solid var(--pink-light); border-radius: 1rem; }
    .form-control:focus, .form-select:focus {
      border-color: var(--pink-main); box-shadow: 0 0 0 .25rem rgba(231, 84, 128, .25);
    }
    .btn-pink { background: var(--pink-main); border-color: var(--pink-main); color: #fff; }
    .btn-pink:hover { background: var(--pink-dark); border-color: var(--pink-dark); color: #fff; }
    .btn-outline-pink { color: var(--pink-main); border-color: var(--pink-main); }
    .btn-outline-pink:hover { background: var(--pink-light); color: var(--pink-dark); border-color: var(--pink-main); }
    .book-card {
      display: block; text-decoration: none; color: inherit; height: 100%;
      background: #fff; border: 1px solid var(--pink-light); border-left: 6px solid var(--pink-main);
      border-radius: 1rem; padding: 1rem; transition: transform .15s, box-shadow .15s;
    }
    .book-card:hover { transform: translateY(-2px); box-shadow: 0 .5rem 1rem rgba(231,84,128,.2); color: inherit; }
    .book-card h6 { color: var(--pink-dark); margin-bottom: .25rem; }
    .tag { display: inline-block; background: var(--pink-soft); color: var(--pink-dark);
           border-radius: 1rem; padding: 0 .6rem; font-size: .75rem; margin: 0 .25rem .25rem 0; }
  </style>
</head>
<body>
<div class="container py-4" style="max-width: 1000px;">
  <a href="/" class="text-decoration-none">← Meniu</a>
  <h1 class="mt-2 mb-1">🔎 Explorează cărțile</h1>
  <p class="text-muted">Caută și filtrează întreaga colecție.</p>

  <div class="filters p-3 mb-4">
    <div class="row g-2">
      <div class="col-md-6">
        <input id="q" class="form-control" placeholder="Titlu sau autor...">
      </div>
      <div class="col-md-3">
        <select id="genre" class="form-select"><option value="">Orice gen</option></select>
      </div>
      <div class="col-md-3">
        <select id="language" class="form-select"><option value="">Orice limbă</option></select>
      </div>
      <div class="col-md-3">
        <select id="min_rating" class="form-select">
          <option value="0">Orice rating</option>
          <option value="3">3.0+</option><option value="3.5">3.5+</option>
          <option value="4">4.0+</option><option value="4.5">4.5+</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="max_pages" class="form-select">
          <option value="0">Orice lungime</option>
          <option value="200">Până la 200 pagini</option>
          <option value="400">Până la 400 pagini</option>
          <option value="700">Până la 700 pagini</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="sort" class="form-select">
          <option value="popular">Cele mai populare</option>
          <option value="rating">Cel mai bun rating</option>
          <option value="title">Alfabetic</option>
        </select>
      </div>
      <div class="col-md-3 d-grid">
        <button id="apply" class="btn btn-pink">Aplică</button>
      </div>
    </div>
  </div>

  <div id="status" class="text-muted mb-3"></div>
  <div id="results" class="row g-3"></div>

  <div class="d-flex justify-content-between align-items-center mt-4">
    <button id="prev" class="btn btn-outline-pink">← Înapoi</button>
    <span id="pageInfo" class="text-muted"></span>
    <button id="next" class="btn btn-outline-pink">Înainte →</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let page = 1;
let totalPages = 1;

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : s;
  return d.innerHTML;
}

async function loadFilters() {
  const f = await (await fetch("/api/filters")).json();
  f.genres.forEach(g => {
    const o = document.createElement("option");
    o.value = g;
    o.textContent = g.replace(/_/g, " ");
    $("genre").appendChild(o);
  });
  f.languages.forEach(l => {
    const o = document.createElement("option");
    o.value = l;
    o.textContent = l;
    $("language").appendChild(o);
  });
}

async function load() {
  const p = new URLSearchParams({
    q: $("q").value.trim(),
    genre: $("genre").value,
    language: $("language").value,
    min_rating: $("min_rating").value,
    max_pages: $("max_pages").value,
    sort: $("sort").value,
    page: page,
    per_page: 18
  });
  $("status").textContent = "Se încarcă...";
  try {
    const data = await (await fetch("/api/books?" + p.toString())).json();
    totalPages = Math.max(1, Math.ceil(data.total / data.per_page));
    $("status").textContent = data.total + " cărți găsite";
    $("pageInfo").textContent = "Pagina " + data.page + " din " + totalPages;
    $("prev").disabled = page <= 1;
    $("next").disabled = page >= totalPages;

    $("results").innerHTML = data.items.map(b => {
      const tags = (b.genres_clean || "").split(" ").filter(Boolean).slice(0, 3)
        .map(g => '<span class="tag">' + esc(g.replace(/_/g, " ")) + "</span>").join("");
      return '<div class="col-md-6 col-lg-4">'
        + '<a class="book-card" href="/book.html?id=' + b.id + '">'
        + "<h6>" + esc(b.title) + "</h6>"
        + '<div class="text-muted small mb-2">' + esc(b.author) + "</div>"
        + '<div class="small mb-2">⭐ ' + (b.avg_rating || "n/a")
        + (b.num_pages ? " · " + Math.round(b.num_pages) + " pag." : "")
        + (b.language ? " · " + esc(b.language) : "") + "</div>"
        + tags + "</a></div>";
    }).join("");
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    $("status").textContent = "Eroare la comunicarea cu serverul.";
  }
}

function apply() { page = 1; load(); }

$("apply").addEventListener("click", apply);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") apply(); });
["genre", "language", "min_rating", "max_pages", "sort"].forEach(id =>
  $(id).addEventListener("change", apply));
$("prev").addEventListener("click", () => { if (page > 1) { page--; load(); } });
$("next").addEventListener("click", () => { if (page < totalPages) { page++; load(); } });

loadFilters().then(load);
</script>
</body>
</html>
