<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalii carte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --pink-bg: #fff0f5; --pink-soft: #fde2ec; --pink-light: #f8c8dc;
      --pink-main: #e75480; --pink-dark: #c2185b; --text-dark: #5a2a3c;
    }
    body { background: var(--pink-bg); color: var(--text-dark); }
    h1, h4, h5 { color: var(--pink-dark); }
    a { color: var(--pink-main); }
    .text-muted { color: #9c6b7e !important; }
    .panel { background: #fff; border: 1px solid var(--pink-light); border-radius: 1rem; padding: 1.5rem; }
    .tag { display: inline-block; background: var(--pink-soft); color: var(--pink-dark);
           border-radius: 1rem; padding: 0 .7rem; font-size: .85rem; margin: 0 .3rem .3rem 0; }
    .bar-row { display: flex; align-items: center; margin-bottom: .4rem; font-size: .9rem; }
    .bar-label { width: 3rem; }
    .bar-track { flex: 1; background: var(--pink-soft); border-radius: .5rem; height: 1rem; overflow: hidden; }
    .bar-fill { background: var(--pink-main); height: 100%; }
    .bar-pct { width: 3.5rem; text-align: right; color: #9c6b7e; }
    .similar-card {
      display: block; text-decoration: none; color: inherit; background: #fff;
      border: 1px solid var(--pink-light); border-left: 6px solid var(--pink-main);
      border-radius: 1rem; padding: .9rem 1rem; height: 100%;
      transition: transform .15s, box-shadow .15s;
    }
    .similar-card:hover { transform: translateY(-2px); box-shadow: 0 .5rem 1rem rgba(231,84,128,.2); color: inherit; }
    .similar-card h6 { color: var(--pink-dark); margin-bottom: .2rem; }
  </style>
</head>
<body>
<div class="container py-4" style="max-width: 900px;">
  <a href="/catalog.html" class="text-decoration-none">← Înapoi la catalog</a>
  <div id="content" class="mt-3"><p class="text-muted">Se încarcă...</p></div>
</div>

<script>
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : s;
  return d.innerHTML;
}

// listele (premii, personaje, locuri) pot veni ca text de forma "['A', 'B']"
function toList(s) {
  if (!s) return [];
  return String(s).replace(/[\[\]"]/g, "").split(/',\s*'|,\s*/)
    .map(x => x.replace(/^'+|'+$/g, "").trim()).filter(Boolean);
}

function tags(list) {
  return list.map(x => '<span class="tag">' + esc(x) + "</span>").join("");
}

function section(title, list) {
  if (!list.length) return "";
  return "<h5 class='mt-4'>" + title + "</h5><div>" + tags(list.slice(0, 20)) + "</div>";
}

function ratingBars(ratings) {
  const vals = ratings.map(v => v || 0);
  const total = vals.reduce((a, b) => a + b, 0);
  if (!total) return '<p class="text-muted">Nu există date despre evaluări.</p>';
  let html = "";
  for (let star = 5; star >= 1; star--) {
    const v = vals[star - 1];
    const pct = (v / total * 100);
    html += '<div class="bar-row"><div class="bar-label">' + star + ' ★</div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div>'
      + '<div class="bar-pct">' + pct.toFixed(0) + "%</div></div>";
  }
  return html;
}

async function load() {
  const id = new URLSearchParams(location.search).get("id");
  const box = document.getElementById("content");
  try {
    const res = await fetch("/api/books/" + encodeURIComponent(id));
    if (!res.ok) { box.innerHTML = '<p class="text-muted">Cartea nu a fost găsită.</p>'; return; }
    const b = await res.json();
    document.title = b.title;

    const genres = (b.genres_clean || "").split(" ").filter(Boolean).map(g => g.replace(/_/g, " "));
    let html = '<div class="panel">';
    html += "<h1 class='h2 mb-1'>" + esc(b.title) + "</h1>";
    html += '<div class="text-muted mb-3">de ' + esc(b.author) + (b.series ? " · seria " + esc(b.series) : "") + "</div>";
    html += "<div class='mb-3'>⭐ <strong>" + (b.avg_rating || "n/a") + "</strong>"
          + (b.num_ratings ? " <span class='text-muted'>(" + Math.round(b.num_ratings).toLocaleString("ro-RO") + " evaluări)</span>" : "")
          + (b.num_pages ? " · " + Math.round(b.num_pages) + " pagini" : "")
          + (b.language ? " · " + esc(b.language) : "")
          + (b.publish_date ? " · publicată " + esc(b.publish_date) : "") + "</div>";
    html += "<div class='mb-3'>" + tags(genres) + "</div>";

    html += "<h5>Descriere</h5>";
    html += b.description
      ? '<p style="white-space: pre-line;">' + esc(b.description) + "</p>"
      : '<p class="text-muted">Nu există descriere pentru această carte.</p>';

    html += section("Premii", toList(b.awards));
    html += section("Personaje", toList(b.characters));
    html += section("Locuri", toList(b.places));

    html += "<h5 class='mt-4'>Distribuția evaluărilor</h5>" + ratingBars(b.ratings || []);
    html += "</div>";

    html += "<h4 class='mt-4 mb-3'>Cărți similare</h4>";
    if (b.similar && b.similar.length) {
      html += '<div class="row g-3">' + b.similar.map(s =>
        '<div class="col-md-6"><a class="similar-card" href="/book.html?id=' + s.id + '">'
        + "<h6>" + esc(s.title) + "</h6>"
        + '<div class="text-muted small">' + esc(s.author) + " · ⭐ " + (s.rating || "n/a")
        + " · " + (s.score * 100).toFixed(0) + "% potrivire</div></a></div>").join("") + "</div>";
    } else {
      html += '<p class="text-muted">Nu am găsit cărți similare.</p>';
    }
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<p class="text-muted">Eroare la comunicarea cu serverul.</p>';
  }
}
load();
</script>
</body>
</html>
