<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recomandator de cărți</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --pink-bg: #fff0f5;       /* fundal pagină */
      --pink-soft: #fde2ec;     /* fundal cardul de căutare */
      --pink-light: #f8c8dc;    /* borduri, accente deschise */
      --pink-main: #e75480;     /* butoane, badge-uri */
      --pink-dark: #c2185b;     /* hover, titluri */
      --text-dark: #5a2a3c;     /* text */
    }
    body { background: var(--pink-bg); color: var(--text-dark); }
    h1, .card-title { color: var(--pink-dark); }
    .text-muted { color: #9c6b7e !important; }

    .search-card {
      background: var(--pink-soft);
      border: 1px solid var(--pink-light);
      border-radius: 1rem;
    }
    .form-control {
      border-color: var(--pink-light);
      border-radius: .75rem 0 0 .75rem;
    }
    .form-control:focus {
      border-color: var(--pink-main);
      box-shadow: 0 0 0 .25rem rgba(231, 84, 128, .25);
    }

    .btn-pink {
      background: var(--pink-main);
      border-color: var(--pink-main);
      color: #fff;
      border-radius: 0 .75rem .75rem 0;
    }
    .btn-pink:hover { background: var(--pink-dark); border-color: var(--pink-dark); color: #fff; }

    .btn-outline-pink {
      color: var(--pink-main);
      border-color: var(--pink-main);
    }
    .btn-outline-pink:hover { background: var(--pink-light); color: var(--pink-dark); border-color: var(--pink-main); }
    .btn-check:checked + .btn-outline-pink {
      background: var(--pink-main);
      border-color: var(--pink-main);
      color: #fff;
    }

    .book-card {
      border: 1px solid var(--pink-light);
      border-left: 6px solid var(--pink-main);
      border-radius: 1rem;
      background: #fff;
      transition: transform .15s, box-shadow .15s;
    }
    .book-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 .5rem 1rem rgba(231, 84, 128, .2);
    }
    .badge-pink { background: var(--pink-main); color: #fff; }
    summary { cursor: pointer; color: var(--pink-main); }
  </style>
</head>
<body>
<div class="container py-5" style="max-width: 800px;">
  <h1 class="mb-1">📚 Recomandator de cărți</h1>
  <p class="text-muted">Alege o carte cunoscută sau descrie ce vrei să citești (în engleză).</p>

  <div class="card card-body search-card mb-4">
    <div class="btn-group mb-3" role="group">
      <input type="radio" class="btn-check" name="mode" id="modeTitle" value="title" checked>
      <label class="btn btn-outline-pink" for="modeTitle">După titlu</label>
      <input type="radio" class="btn-check" name="mode" id="modeText" value="text">
      <label class="btn btn-outline-pink" for="modeText">După descriere</label>
    </div>

    <div class="input-group">
      <input type="text" id="query" class="form-control" placeholder="ex: harry potter">
      <button id="searchBtn" class="btn btn-pink">Caută</button>
    </div>
  </div>

  <div id="status" class="text-muted mb-3"></div>
  <div id="results" class="row g-3"></div>
</div>

<script>
const queryInput = document.getElementById("query");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML;
}

document.querySelectorAll('input[name="mode"]').forEach(r => {
  r.addEventListener("change", () => {
    queryInput.placeholder = r.value === "title"
      ? "ex: harry potter"
      : "ex: dark atmosphere detective murder mystery";
  });
});

async function search() {
  const q = queryInput.value.trim();
  if (!q) return;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const url = mode === "title"
    ? `/api/by-title?title=${encodeURIComponent(q)}&n=10`
    : `/api/by-text?q=${encodeURIComponent(q)}&n=10`;

  statusEl.textContent = "Se caută...";
  resultsEl.innerHTML = "";
  try {
    const res = await fetch(url);
    const books = await res.json();
    if (!books.length) {
      statusEl.textContent = "Nu am găsit rezultate. Încearcă alt titlu sau alți termeni (în engleză).";
      return;
    }
    statusEl.textContent = `${books.length} recomandări:`;
    resultsEl.innerHTML = books.map(b => `
      <div class="col-12">
        <div class="card book-card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h5 class="card-title mb-1">${esc(b.title)}</h5>
                <h6 class="card-subtitle text-muted mb-2">${esc(b.author)}</h6>
              </div>
              <span class="badge badge-pink">${(b.score * 100).toFixed(0)}% potrivire</span>
            </div>
            <p class="mb-1">⭐ ${b.rating ?? "n/a"}</p>
            ${b.description
              ? `<details class="mb-2">
                   <summary class="small">Descriere</summary>
                   <p class="small mt-2 mb-0">${esc(b.description)}</p>
                 </details>`
              : ""}
            ${b.because.length
              ? `<small class="text-muted">Potrivit datorită: ${b.because.map(esc).join(", ")}</small>`
              : ""}
          </div>
        </div>
      </div>`).join("");
  } catch (e) {
    statusEl.textContent = "Eroare la comunicarea cu serverul.";
  }
}

document.getElementById("searchBtn").addEventListener("click", search);
queryInput.addEventListener("keydown", e => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
